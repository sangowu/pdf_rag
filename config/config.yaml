# OCR Settings
ocr:
  # Legacy flat settings (still read by some scripts, keep for compatibility)
  lang: "ch"
  use_angle_cls: true
  confidence_threshold: 0.8

  # PaddleOCR-VL-1.5 configuration
  paddleocrv1:
    # Optional: force device (e.g. "cpu", "gpu:0"); when null use PaddleX default
    device: "gpu:0"
    # Sub-pipeline switches
    use_doc_orientation_classify: false
    use_doc_unwarping: false
    use_layout_detection: true
    use_chart_recognition: false
    use_seal_recognition: false

    # Layout detection threshold (0-1)
    layout_threshold: 0.5
    # Shape mode: "rect", "quad", "poly", "auto"
    layout_shape_mode: "auto"

    # Batch processing: number of PDFs passed to pipeline.predict() at once
    batch_size: 4

# Chunking Settings
# type: "fixed" = fixed-size sliding window; "recursive" = try separators in order (LangChain RecursiveCharacterTextSplitter style)
chunking:
  type: "fixed"
  chunk_size: 800
  chunk_overlap: 200
  # Max number of OCR structured JSON files to chunk; 0 = no limit (full-scale)
  file_limit: 0
  # Used when type is "recursive"; tried in order until chunks are <= chunk_size
  separators:
    - "。"     # 中文句号
    - "．"     # 全角英文句号
    - "."      # 英文句号
    - "！"     # 中文感叹号
    - "!"      # 英文感叹号
    - "？"     # 中文问号
    - "?"      # 英文问号
    # 弱语义边界（句内停顿）
    - "；"     # 中文分号
    - ";"      # 英文分号
    - "，"     # 中文逗号
    - ","      # 英文逗号
    - "、"     # 顿号
    # 结构符号（OCR噪声，降到最低优先级）
    - "\n\n"
    - "\n"
    - " "
    - ""
  # Optional: only for recursive; whether to keep separator at end of chunk (default false)
  keep_separator: false

  # Parent-Child chunking (used when type is "parent_child")
  parent_chunk_size: 800
  parent_chunk_overlap: 200
  child_chunk_size: 200
  child_chunk_overlap: 50

# Embedding Settings
embedding:
  model: "BAAI/bge-m3"  
  dimension: 1024
  batch_size: 64

  mode: "local"
  local_model_path: "models/bge-m3"  
  dtype: "bfloat16"
  device: "cuda"

# Retrieval: vector (embedding+Chroma), bm25, or hybrid (RRF of both)
retrieval:
  method: "vector"   # "vector" | "bm25" | "hybrid"
  rrf_k: 60          # RRF constant (only for hybrid)

# Reranker Settings (bge-reranker-v2-m3; optional, used after retrieval)
# When enabled: first-stage retrieves top_r, reranker scores and returns top evaluation.top_k
reranker:
  enabled: false
  top_r: 20
  model_name: "BAAI/bge-reranker-v2-m3"
  local_model_path: "models/bge-reranker-v2-m3"
  device: "cuda"
  torch_dtype: "bfloat16"
  batch_size: 32
  max_length: 512

# ChromaDB Settings
chromadb:
  persist_directory: "vectors/chroma_db"
  collection_name: "pdf_chunks"
  distance_fn: "cosine"
  parent_collection_name: "parent_chunks"

# LLM Settings (local transformers)
llm:
  mode: "local"  # 默认使用本地模型；可选 "local" 或 "api"
  
  # API 模式配置（备用）
  api:
    model: "Qwen/Qwen3-8B"
  
  # 本地模式配置（默认）
  local:
    # Use local downloaded model under project root, to avoid re-downloading
    model_name: "models/Qwen3-8B"
    device: "cuda"
    # Batch size for local LLM generation (QA from chunks)
    batch_size: 32
    max_tokens: 512
    torch_dtype: "bfloat16"
    do_sample: false  # greedy decoding; faster and deterministic
    # Sampling params (only used when do_sample: true)
    temperature: 0.7
    top_p: 0.8
    top_k: 20
    min_p: 0.0


# Evaluation Settings
evaluation:
  top_k: 5
  num_samples: 10

# Paths
# pipeline_version: set to a short label (e.g. "fixed", "recursive") to keep chunk/embedding outputs per version; leave empty to overwrite.
paths:
  pipeline_version: ""
  pdf_dir: "data/raw/OpenDataLab___OmniDocBench/pdfs"
  omnidoc_json: "data/raw/OpenDataLab___OmniDocBench/OmniDocBench.json"
  gold_answers_csv: "data/answers/gold_answers.csv"
  metrics_csv: "results/metrics.csv"
  log_dir: "results/logs"
  ocr_output_dir: "results/ocr_outputs"
  ocr_structured_dir: "results/ocr_structured"
  chunk_results_dir: "results/chunk_results"
  vector_store_dir: "vectors/chroma_db"
  all_chunk_path: "results/chunk_results/all_chunks.json"
  all_parent_chunk_path: "results/chunk_results/all_parent_chunks.json"
  normalized_data_path: "data/answers/normalized_data.json"
