services:
  api:
    build: .
    image: pdf-parser-rag:latest
    command: uvicorn src.api.main:app --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"
    volumes:
      - ./models:/app/models          # BGE-M3 + reranker weights
      - ./vectors:/app/vectors        # ChromaDB persistent data
      - ./.env:/app/.env              # API keys
    environment:
      - CUDA_VISIBLE_DEVICES=0
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    restart: unless-stopped

  demo:
    image: pdf-parser-rag:latest
    command: python scripts/gradio_demo.py --api-url http://api:8000
    ports:
      - "7860:7860"
    depends_on:
      - api
    restart: unless-stopped
